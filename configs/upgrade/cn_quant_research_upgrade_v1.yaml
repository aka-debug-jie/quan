candidates:
  - id: AF7_TOP50_D20_EQ
    description: AF7 top 50 equal weight, rebalance every 20 sessions.
  - id: AF7_TOP50_D20_HOLD100_BAND25
    description: "Every 20 sessions retain actual post-close holdings with AF7 rank <= 100 and fill to 50 by descending AF7 score; target weight 2%; no trade inside the inclusive [1.5%,2.5%] actual close-weight band, otherwise reset to 2%; exited members target zero; symbol-ascending ties."
  - id: AF7_TOP50_D5_STEP25
    description: "Every 5 sessions select AF7 top 50 with full target weight 2%; intermediate shares = current + 0.25*(full_target-current); buys round down to board-specific buy units; sells permit corporate-action odd lots, selling the full holding when the remaining quantity is below the standard buy unit; T-close information, symbol-ascending ties."
  - id: AF7_LOW_AVOID100_D20
    description: "Every 20 sessions first take mean_amount60 liquidity rank <= 100, then exclude the 20 lowest AF7-scoring names within that set; hold the remaining 80 equal weight; T-close information, descending AF7 score and symbol-ascending ties."
  - id: MOM605_TOP50_D20_EQ
    description: "MOM605 = log(P[t-5]/P[t-60]); top 50 equal weight every 20 sessions; T-close information only; descending score, symbol-ascending ties."
  - id: CONDREV5_TOP50_D20_EQ
    description: "CONDREV5 = -log(P[t]/P[t-5]); require mean_amount20 >= daily complete-eligible median and annualized vol20 <= daily complete-eligible 75th percentile, otherwise exclude; top 50 equal weight every 20 sessions; T-close information only; descending score, symbol-ascending ties."
  - id: DOWN60_TOP50_D20_EQ
    description: "DOWN60 = -sqrt(mean(min(log(P[t]/P[t-1]),0)^2)*252), over 60 sessions; top 50 equal weight every 20 sessions; T-close information only; descending score, symbol-ascending ties."
  - id: ROBUSTTREND_TOP50_D20_EQ
    description: "ROBUSTTREND = 0.5*daily_z(MOM605)+0.5*daily_z(DOWN60); z uses complete 300-name cross section, ddof=0, no winsorization; top 50 equal weight every 20 sessions; T-close information only; descending score, symbol-ascending ties."
