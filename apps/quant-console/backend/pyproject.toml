[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-console"
version = "0.1.0"
description = "Local read-only console for Quant Stack research evidence"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "pyarrow==23.0.1",
  "uvicorn==0.34.3",
]

[project.scripts]
quant-console = "quant_console.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_console"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quant_console"]
omit = ["src/quant_console/cli.py", "src/quant_console/observer.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
