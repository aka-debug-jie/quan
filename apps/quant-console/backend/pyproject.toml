[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-console"
version = "0.2.0"
description = "Typed local read-only console for Quant Stack research evidence"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pyarrow==25.0.1",
  "uvicorn==0.53.0",
]

[project.scripts]
quant-console = "quant_console.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_console"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quant_console"]
omit = ["src/quant_console/observer.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
