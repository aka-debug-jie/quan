name: ci

on:
  pull_request:
  push:
    branches: [main, "codex/**", "issue/**", "research/**", "prospective/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system test runtime
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends poppler-utils python3 tzdata git
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          enable-cache: true
      - run: uv sync --locked --group v2
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=quant_stack --cov=quant_stack_v2 --cov=quant_stack_v3

  v2-environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          enable-cache: true
      - name: Install locked V2 dependency group
        run: uv sync --locked --group v2
      - name: Verify V2 versions and synthetic model round trips
        run: uv run --no-sync --offline pytest -v tests/v2_environment_smoke.py
      - name: Verify limited development exporter and runner end to end
        run: uv run --group v2 --no-sync --offline pytest -v tests/v2_dev_runner_smoke.py tests/v2_dev_runner_safety.py tests/v2_dev_real_smoke.py

  v3-historical-environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          enable-cache: true
      - name: Install locked V3 historical dependency group
        run: uv sync --locked --group v3-historical
      - name: Verify V3 offline bundle, factors, execution, and ledger paths
        run: >-
          uv run --group v3-historical --no-sync --offline pytest -v
          tests/test_v3_bundle.py
          tests/test_v3_protocol_factors.py
          tests/test_v3_targets.py
          tests/test_v3_crosscheck.py
          tests/test_v3_fast_engine.py
          tests/test_v3_runner.py
